name: Audit Deleted BITwiki V1 Content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive-v1/**'
      - 'scripts/verify_v1_fidelity.py'
      - 'scripts/audit_v1_deleted_content.py'
      - '.github/workflows/audit-v1-deleted-content.yml'

permissions:
  contents: read

concurrency:
  group: audit-bitwiki-v1-deleted-content
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Generate current live fidelity prerequisite
        id: fidelity
        continue-on-error: true
        run: python scripts/verify_v1_fidelity.py

      - name: Audit deleted revision recoverability
        id: deleted
        continue-on-error: true
        run: python scripts/audit_v1_deleted_content.py

      - name: Extract unresolved deleted titles
        id: unresolved
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('v1-deleted-content-audit.json').read_text())
          unresolved=[r for r in d['records'] if not r['currently_exists_exact'] and not r['obvious_normalized_survivor']]
          exact=[r for r in d['records'] if r['currently_exists_exact']]
          normalized=[r for r in d['records'] if r['obvious_normalized_survivor']]
          source=json.loads(Path('v1-fidelity-audit.json').read_text())
          comments={(int(e.get('ns',0)),e.get('title')):e.get('comment','') for e in source.get('public_delete_log_events',[]) if e.get('action')=='delete'}
          def row(r):
              return {
                'ns':r['ns'],'title':r['title'],'delete_comment':comments.get((r['ns'],r['title']),''),
                'deleted_revision_content_recoverable_anonymously':bool(r['deleted_revision_content_returned']),
                'api_errors':r['api_errors']
              }
          out={
            'unique_deleted_titles':d['unique_deleted_titles'],
            'normalized_survivor_count':len(normalized),
            'exact_recreated_count':len(exact),
            'unresolved_deleted_title_count':len(unresolved),
            'unresolved_deleted_titles':[row(r) for r in unresolved],
            'exact_recreated_titles':[row(r) for r in exact],
            'note':'Unresolved means no exact current title and no obvious counterpart after removing common FINAL/final/revised affixes. It does not prove unique semantic content; deleted bodies are inaccessible anonymously.'
          }
          Path('v1-deleted-unresolved.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload deleted-content evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitwiki-v1-deleted-content-evidence
          path: |
            v1-fidelity-audit.json
            v1-deleted-content-audit.json
            v1-deleted-unresolved.json
          if-no-files-found: error

      - name: Enforce audit execution
        if: steps.fidelity.outcome != 'success' || steps.deleted.outcome != 'success' || steps.unresolved.outcome != 'success'
        run: |
          echo 'One or more V1 evidence stages failed; inspect the uploaded artifact.'
          exit 1
