name: Audit Deleted BITwiki V1 Content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v1-fidelity-audit.json'
      - 'scripts/audit_v1_deleted_content.py'
      - '.github/workflows/audit-v1-deleted-content.yml'

permissions:
  contents: write

concurrency:
  group: audit-bitwiki-v1-deleted-content
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Audit deleted revision recoverability
        run: python scripts/audit_v1_deleted_content.py
      - name: Commit deleted-content audit
        run: |
          git config user.name 'BITwiki Fidelity Bot'
          git config user.email 'bitwikicryptopedia@gmail.com'
          git add v1-deleted-content-audit.json
          if git diff --cached --quiet; then
            echo 'Deleted-content audit unchanged.'
          else
            git commit -m 'Refresh deleted V1 content audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
