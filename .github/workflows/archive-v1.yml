name: Archive BITwiki V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/archive_v1.py
      - .github/workflows/archive-v1.yml

permissions:
  contents: write

concurrency:
  group: archive-bitwiki-v1
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install harvester dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Preserve local namespace labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/archive_v1.py')
          s=p.read_text()
          old="i=int(n['id']); name=n.get('canonical') or n.get('name') or ('Main' if i==0 else f'NS-{i}'); name='Main' if i==0 else name"
          new="i=int(n['id']); name=n.get('name') or n.get('canonical') or ('Main' if i==0 else f'NS-{i}'); name='Main' if i==0 else name"
          if old in s:
              s=s.replace(old,new)
              p.write_text(s)
          assert old not in p.read_text(), 'Archive harvester still prefers canonical namespace names'
          PY

      - name: Harvest complete public V1
        id: harvest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/archive_v1.py 2>&1 | tee /tmp/archive-v1-run.log

      - name: Verify completeness assertions
        id: verify
        if: steps.harvest.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('archive-v1/audit.json').read_text())
          failed=[k for k,v in a['completeness'].items() if not v]
          assert not failed, f'Completeness assertions failed: {failed}'
          assert a['page_count'] > 0
          assert a['revision_count'] >= a['page_count']
          assert a['namespace_counts_by_name'].get('Main',0) >= 162, a['namespace_counts_by_name']
          assert 'BITwiki' in a['namespace_counts_by_name'], a['namespace_counts_by_name']
          assert 'Template' in a['namespace_counts_by_name']
          assert 'Category' in a['namespace_counts_by_name']
          assert a.get('file_binary_revision_count',0) >= a.get('file_page_count',0)
          for q in ['Uncategorizedpages','Uncategorizedtemplates','Unusedtemplates','Wantedcategories','Unusedcategories','BrokenRedirects','DoubleRedirects']:
              assert q in a['querypage_counts'], f'Missing required report {q}'
          print(json.dumps(a, indent=2))
          PY

      - name: Restore last good archive on failure
        if: steps.harvest.outcome != 'success' || steps.verify.outcome != 'success'
        run: |
          git checkout -- archive-v1
          git clean -fd archive-v1

      - name: Write run status
        if: always()
        env:
          HARVEST_OUTCOME: ${{ steps.harvest.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/archive-v1-run.log')
          data={
            'completed_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'harvest': os.environ.get('HARVEST_OUTCOME','unknown'),
            'verify': os.environ.get('VERIFY_OUTCOME','skipped'),
            'last_log_lines': log.read_text(errors='replace').splitlines()[-120:] if log.exists() else []
          }
          Path('archive-v1-run-status.json').write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: Commit archive or diagnostic status
        if: always()
        run: |
          git config user.name 'BITwiki Archive Bot'
          git config user.email 'bitwikicryptopedia@gmail.com'
          git add archive-v1-run-status.json scripts/archive_v1.py
          if [ "${{ steps.harvest.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ]; then
            git add -A archive-v1
          fi
          if git diff --cached --quiet; then
            echo 'Archive and status already current.'
          else
            if [ "${{ steps.harvest.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ]; then
              git commit -m 'Refresh exhaustive public V1 archive'
            else
              git commit -m 'Record failed V1 archive refresh'
            fi
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitwiki-v1-public-archive
          path: |
            archive-v1
            archive-v1-run-status.json
          if-no-files-found: error

      - name: Enforce successful archive
        if: steps.harvest.outcome != 'success' || steps.verify.outcome != 'success'
        run: |
          cat archive-v1-run-status.json
          exit 1
