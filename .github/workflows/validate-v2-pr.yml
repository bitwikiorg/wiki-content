        if: always()
        run: |
          python scripts/test_editorial_architecture.py
          python -m unittest discover -s scripts -p 'test_two_depth_source_contract.py'
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          find Module -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 scripts/test_semantic_entry.lua
      - name: Build and audit combined staging projection
        if: always()
        run: |
          node --check staging/frontend/app.js
          python staging/compiler/build.py
          python scripts/audit_staging_readiness.py
      - name: Upload combined validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-cohort-validation
          path: |
            v2-validation.json
            v2-runtime-schema-audit.json
            v2-substrate-audit.json
            v2-workflow-audit.json
            v2-mainspace-audit.json
            v2-staging-readiness.json
          if-no-files-found: warn
