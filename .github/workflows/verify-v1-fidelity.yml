name: Verify BITwiki V1 Fidelity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive-v1/**'
      - 'scripts/verify_v1_fidelity.py'
      - '.github/workflows/verify-v1-fidelity.yml'

permissions:
  contents: write

concurrency:
  group: verify-bitwiki-v1-fidelity
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Compare live V1 against archive
        id: verify
        continue-on-error: true
        run: python scripts/verify_v1_fidelity.py

      - name: Commit fidelity audit
        if: always()
        run: |
          git config user.name 'BITwiki Fidelity Bot'
          git config user.email 'bitwikicryptopedia@gmail.com'
          git add v1-fidelity-audit.json
          if git diff --cached --quiet; then
            echo 'Fidelity report unchanged.'
          else
            git commit -m 'Refresh live V1 fidelity audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce content fidelity
        if: steps.verify.outcome != 'success'
        run: |
          cat v1-fidelity-audit.json
          exit 1
