name: Verify BITwiki V1 Fidelity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive-v1/**'
      - 'scripts/verify_v1_fidelity.py'
      - '.github/workflows/verify-v1-fidelity.yml'

permissions:
  contents: read

concurrency:
  group: verify-bitwiki-v1-fidelity
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Compare live V1 against archive
        id: verify
        continue-on-error: true
        run: python scripts/verify_v1_fidelity.py

      - name: Upload fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitwiki-v1-fidelity-evidence
          path: v1-fidelity-audit.json
          if-no-files-found: error

      - name: Enforce content fidelity
        if: steps.verify.outcome != 'success'
        run: |
          test ! -f v1-fidelity-audit.json || cat v1-fidelity-audit.json
          exit 1
